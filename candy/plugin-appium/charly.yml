version: 2026.232.0520
plugin-appium:
    candy:
        version: 2026.174.0700
        description: |-
            OUT-OF-TREE charly plugin serving the `appium` W3C-WebDriver check verb —
            a standalone Go module (go.mod + main.go) that drives a running Appium 3.x
            server over go-plugin gRPC via the charly plugin SDK (github.com/opencharly/sdk).
            charly's loader fetches this candy's repo, go-builds the provider binary on
            the HOST, and serves it OUT-OF-PROCESS via LocalTransport — so the heavy
            github.com/tebeka/selenium dependency (and transitive packages) lives
            HERE, out of charly's core go.mod, while `appium:` authoring stays
            unchanged: the `appium: <method>` sugar desugars to plugin/plugin_input —
            the method + every appium-exclusive modifier ride the input map, validated
            against this plugin's own #AppiumInput — and dispatches through the provider
            registry exactly like a built-in (ResolveVerb → grpcProvider →
            invokeVerbProvider hands it the full desugared #Op). Provides the full
            48-method W3C surface (status/session/find/click/
            send-keys/screenshot/gesture-*/app-*/key-*/device-*/execute/raw) plus the
            session method (Cutover E, E-5): a DETACHED device-side screen-recording
            bracket (startRecordingScreen/stopRecordingScreen → MP4) over the runner's
            generic background-session service. The R10
            consumer is the check-android-emulator-pod bed (via android-emulator-layer).
        plugin:
            providers:
                - verb:appium
            source: github.com/opencharly/plugin-appium/candy/plugin-appium
            primary:
                appium: method
        plan:
            - check: the running Appium server reports itself ready over the appium status verb (the out-of-process plugin verb dispatches through the registry and probes the live server)
              id: appium-status-ready
              appium: status
              stdout:
                - contains: '"ready":true'
              context:
                - runtime
            # E-5 R3 (2026-09-08, R5): the baked session lifecycle is DELETED here —
            # the distro fixture owns the ONE-identity WebDriver session (its overlay
            # session-create with the 3600s caps) and the RUNNER's instrument recorder
            # brackets it; a parallel create/recorder/delete inside this candy's plan
            # churned the SHARED session file mid-run, deleted the fixture's pinned
            # session server-side, and the recorder's final stop then 404'd
            # (runs 2026.251.1102/1122 — the evidence gate failed with segments=0).
            # This plugin's plan now only probes the server (status); the session
            # method remains fully served to consumers that author it.
